# orca settings — edit freely, commit with the project.
# format/lint/test: one shell command per key; `off` disables the gate. Delete the stack lines (or the whole file) to re-run auto-discovery.
# planningAgent/codingAgent/reviewAgent (harness[:model]): override the global settings file; a flow's own code overrides both.
# project/plugins.sbt; sbt-scalafmt plugin v2.5.2; format configuration in .scalafmt.conf
format = sbt scalafmt
# build.sbt; compiles main and test sources with strict flags (-Wunused:all, -Wvalue-discard, -Wnonunit-statement) without executing tests; lines 8-17
lint = sbt compile
# .github/workflows/ci.yml; runs unit tests via sbt; CI runs 'sbt +test' at line 34; uses munit framework (build.sbt line 33)
test = sbt test
