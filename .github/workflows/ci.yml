name: CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

# The `test` job runs the unit suites only. The integration suites gated on
# `ORCA_INTEGRATION=1` need an authenticated `claude`/`gh` and stay skipped —
# except `FlowScriptsCompileTest`, which needs only scala-cli and gets its own
# `flow-scripts` job, with the env var scoped to that one `testOnly`. Run the
# rest locally with `ORCA_INTEGRATION=1 sbt test`.
#
# Publish runs inline (rather than reusing
# softwaremill/github-actions-workflows) because `secrets: inherit` only
# works across the same org or enterprise, and orca lives in VirtusLab.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - run: sbt +test

  # Compiles every `flows/` script against a locally published build, so an API
  # change that breaks the flows fails here instead of shipping. Independent of
  # `test` so the fast unit job isn't held up by the publishLocal + scala-cli
  # round-trip.
  flow-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dynver derives the published version from git history
      # Ahead of setup-java: it installs scala-cli through coursier, which
      # points JAVA_HOME at its own JDK 17 — sbt then rejects `-release 21`.
      # setup-java runs second so JAVA_HOME ends up on 21. scala-cli picks its
      # own JVM per script (`//> using jvm 21`).
      - uses: VirtusLab/scala-cli-setup@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - run: sbt "runner/testOnly *FlowScriptsCompileTest"
        env:
          ORCA_INTEGRATION: '1'

  publish:
    needs: [test]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - name: Publish artifacts
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> "$GITHUB_ENV"
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: true
          name: "v${{ env.VERSION }}"
          tag: "v${{ env.VERSION }}"
          version: "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
